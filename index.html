<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOS Alliance Tracker</title>
    <!-- Tailwind CSS 및 FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f0f7ff; color: #1e293b; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .ice-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); border: 1px solid #bae6fd; }
        .btn-theme { background: linear-gradient(135deg, #0ea5e9, #0284c7); color: white; }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- Header -->
    <header class="max-w-5xl mx-auto mb-8 flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-black text-sky-900 tracking-tight">WOS ALLIANCE TRACKER</h1>
            <p class="text-sky-600 font-medium">실시간 전투 데이터 및 기여도 관리</p>
        </div>
        <span id="analysis-date-range" class="inline-flex items-center px-4 py-2 rounded-xl text-xs font-bold bg-white text-sky-700 border border-sky-100 shadow-sm">
            <i class="fa-solid fa-sync fa-spin mr-2"></i> 데이터 동기화 중...
        </span>
    </header>

    <!-- Main Dashboard -->
    <main class="max-w-5xl mx-auto space-y-6">
        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="ice-card p-6 rounded-2xl shadow-lg border-t-4 border-sky-400">
                <p class="text-sky-500 font-bold text-sm uppercase">총 활동 인원</p>
                <h2 id="total-members" class="text-3xl font-black mt-1">0</h2>
            </div>
            <div class="ice-card p-6 rounded-2xl shadow-lg border-t-4 border-sky-400">
                <p class="text-sky-500 font-bold text-sm uppercase">평균 성장률</p>
                <h2 id="avg-growth" class="text-3xl font-black mt-1">0%</h2>
            </div>
            <div class="ice-card p-6 rounded-2xl shadow-lg border-t-4 border-sky-400">
                <p class="text-sky-500 font-bold text-sm uppercase">목표 달성 인원</p>
                <h2 id="goal-met" class="text-3xl font-black mt-1">0</h2>
            </div>
        </div>

        <!-- Table -->
        <div class="ice-card rounded-2xl shadow-lg overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead class="bg-sky-50 text-sky-800 text-xs uppercase font-bold">
                    <tr>
                        <th class="p-4">연맹원</th>
                        <th class="p-4 text-right">이전 기록</th>
                        <th class="p-4 text-right">현재 기록</th>
                        <th class="p-4 text-right">성장 폭</th>
                    </tr>
                </thead>
                <tbody id="member-table-body" class="divide-y divide-sky-100">
                    <!-- 데이터가 이곳에 삽입됩니다 -->
                </tbody>
            </table>
        </div>
    </main>

    <script>
        // [설정] 배포된 Apps Script URL 입력
        const WEB_APP_URL = 'YOUR_WEB_APP_URL_HERE';

        async function initData() {
            try {
                const response = await fetch(WEB_APP_URL);
                const data = await response.json();
                
                const tbody = document.getElementById('member-table-body');
                tbody.innerHTML = '';
                
                data.forEach(m => {
                    const growth = m.current - m.past;
                    const row = `
                        <tr class="hover:bg-sky-50/50 transition">
                            <td class="p-4 font-bold text-sky-900">${m.name}</td>
                            <td class="p-4 text-right">${m.past.toLocaleString()}</td>
                            <td class="p-4 text-right">${m.current.toLocaleString()}</td>
                            <td class="p-4 text-right font-black ${growth >= 0 ? 'text-emerald-600' : 'text-rose-600'}">
                                ${growth >= 0 ? '+' : ''}${growth.toLocaleString()}
                            </td>
                        </tr>
                    `;
                    tbody.insertAdjacentHTML('beforeend', row);
                });

                document.getElementById('analysis-date-range').innerHTML = '<i class="fa-solid fa-check mr-2 text-emerald-500"></i> 최신 데이터 반영됨';
                updateStats(data);
            } catch (e) {
                console.error("데이터 로드 실패", e);
                document.getElementById('analysis-date-range').innerText = "데이터 연결 오류";
            }
        }

        function updateStats(data) {
            document.getElementById('total-members').innerText = data.length;
            document.getElementById('goal-met').innerText = data.filter(m => (m.current - m.past) > 5000).length;
            // 평균 성장률 계산 등 추가 가능
        }

        initData();
    </script>
</body>
</html>
